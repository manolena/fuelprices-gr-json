# Converts the daily fuel price bulletin of www.fuelprices.gr to prices.json.
# Runs Monday-Saturday a few times a day (the bulletin appears on working days,
# usually before noon Greek time) and commits prices.json when it changed.
name: Update fuel prices

on:
  schedule:
    - cron: "20 6,9,12,15 * * 1-6"   # UTC
  workflow_dispatch:                  # "Run workflow" button in the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pypdf
      - run: python convert.py prices.json
      - name: Commit prices.json if changed
        run: |
          if git diff --quiet -- prices.json; then
            echo "No change"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add prices.json
            git commit -m "Fuel prices $(python -c 'import json;print(json.load(open("prices.json"))["date"])')"
            git push
          fi
